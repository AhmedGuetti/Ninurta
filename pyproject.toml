[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ninurta"
version = "0.1.0"
description = "Intelligent job-search automation pipeline powered by LLMs"
requires-python = ">=3.10"
dependencies = [
    "fire>=0.6.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.27",
    "sqlalchemy>=2.0.0",
    "pyyaml>=6.0",
    "langgraph>=0.2.0",
]

[project.optional-dependencies]
sqlite     = ["sqlalchemy>=2.0.0"]
openai     = ["openai>=1.0.0"]
anthropic  = ["anthropic>=0.30.0"]
gemini     = ["google-genai>=1.0"]
documents  = ["pymupdf>=1.24", "python-docx>=1.1"]
transformers = ["transformers", "torch", "accelerate"]
all        = [
    "openai>=1.0.0",
    "anthropic>=0.30.0",
    "google-genai>=1.0",
    "sqlalchemy>=2.0.0",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "transformers",
    "torch",
    "accelerate",
]

[project.scripts]
ninurta = "ninurta.cli:main"

[tool.setuptools.packages.find]
where = ["."]
